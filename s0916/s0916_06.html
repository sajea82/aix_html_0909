<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <label>나이 입력 : </label> 
    <input type="text" name="age" id="age"><br>
    <button type="button" onclick="btn()">확인</button>
    <script>
        // 확인버튼을 클릭시 input에 있는 나이를 확인해서
        // 18세 이상 성인입니다. 18세미만 미성년자입니다.
        // alert() 출겨하시오
        function btn(){
            //alert("test")
            var age = Number(document.getElementById("age").value );
            if (age>=18)
                alert("성인입니다.");
            else
                alert("미성년자입니다.");

        }
    </script>
</body>
</html>
