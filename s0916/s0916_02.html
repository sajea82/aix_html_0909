<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <div id="d01"></div>
    <div id="d02">몫 : </div>
    <div id="d03">나머지 : </div>
    <script>
        // 타입 : str,int,float,boolean,
        // 형변환 : Number(),parseInt(),parseFloat(),toString()
        // 몫 : parseIntd(10/3)
        document.getElementById("d01").innerText = 10/3;
        document.getElementById("d02").innerText = "몫 : " + parseInt(10/3);
        document.getElementById("d03").innerText = "나머지 : " + 10%3;

        var a = 10;
        var b = 3;
        var result = a>b?"a가 더 큽니다.":"b가 더 큽니다.";
        // 출력하는 방법 console.log, document.write, alert
        // confirm, prompt
        console.log("콘솔 :"+result);
        document.write("화면에 출력이 됩니다."+result);
        alert(result); //경고창
        if(confirm("프로그램을 종료하시겠습니까?")){
            console.log("네");
        }
        else{
            confirm.log("아니요");
        }
        
        var num = prompt("값 입력");
        confirm.log("숫자 :"+num)
    </script>
</body>
</html>
