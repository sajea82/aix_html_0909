<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="http://code.jquery.com/jquery-latest.min.js"></script>
    <title>Document</title>

    <style>
        h2{text-align: center;}

        table,th,td{
            border:1px solid black;
            border-collapse: collapse;
        }

        table{
            width:1000px;
            text-align:center;
            box-sizing:border-box;
            margin:50px auto;
        }

        th{
            background:#efefef;
            height:60px;
        }

        td{
            height:40px;
        }
    </style>
</head>

<body>

    <h2>학생성적프로그램</h2>

    <input type="text" name="no" id="no" placeholder="번호입력"><br>
    <input type="text" name="name" id="name" placeholder="이름입력"><br>
    <input type="text" name="kor" id="kor" placeholder="국어점수입력"><br>
    <input type="text" name="eng" id="eng" placeholder="영어점수입력"><br>
    <input type="text" name="math" id="math" placeholder="수학점수입력"><br>

    <button type="button">저장</button>

    <table>
        <colgroup>
            <col width="10%">
            <col width="15%">
            <col width="10%">
            <col width="10%">
            <col width="10%">
            <col width="10%">
            <col width="10%">
            <col width="10%">
            <col width="15%">
        </colgroup>

        <thead>
            <tr>
                <th>번호</th>
                <th>이름</th>
                <th>국어</th>
                <th>영어</th>
                <th>수학</th>
                <th>합계</th>
                <th>평균</th>
                <th>등수</th>
                <th>버튼</th>
            </tr>
        </thead>

        <tbody id="tbody">
        </tbody>
    </table>


    <script>

        // 빈 배열
        var students = [];


        // 학생정보 1개 넣기
        students.push({
            no:1,
            name:"홍길동",
            kor:100,
            eng:100,
            math:100,
            total:300,
            avg:100,
            rank:0
        });


        // 학생정보 1개 넣기
        students.push({
            no:2,
            name:"유관순",
            kor:100,
            eng:100,
            math:100,
            total:300,
            avg:100,
            rank:0
        });


        // students에 들어있는 학생 수만큼 반복
        for(var i=0; i<students.length; i++){

            var no = students[i].no;
            var name = students[i].name;
            var kor = students[i].kor;
            var eng = students[i].eng;
            var math = students[i].math;
            var total = students[i].total;
            var avg = students[i].avg;
            var rank = students[i].rank;


            var tr = `
                <tr id="${no}">
                    <td>${no}</td>
                    <td>${name}</td>
                    <td>${kor}</td>
                    <td>${eng}</td>
                    <td>${math}</td>
                    <td>${total}</td>
                    <td>${avg}</td>
                    <td>${rank}</td>
                    <td>
                        <button class="update">수정</button>
                        <button class="delete">삭제</button>
                    </td>
                </tr>
            `;


            // tbody에 tr 추가
            $("#tbody").append(tr);
        }

    </script>

</body>
</html>
