<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box{width: 60px; height: 60px; margin: 60px; 
            animation: rotate 1.5s infinite, background 1.5s infinite alternate; margin: 0 auto;}

        @keyframes rotate {
            from{transform: perspective(120px) rotate(0deg) rotateY('0deg');}
            50%{transform: perspective(120px) rotateX('-180deg') rotateY('0deg');}
            to{transform: perspective(120px) rotateX('-180deg') rotateY('-180');}
        }

        @keyframes background {
            from{background: red;}
            50%{background: green; }
            to{background: blue; border-radius: 50%;}
        }
    </style>
</head>
<body>
    <div class="box"></div>

</body>
</html>
