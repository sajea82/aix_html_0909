<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{margin: 0; padding: 0;}
        div{margin: 50px auto; width: 600px; text-align: center;}
        h2{margin-bottom: 30px; font-size: 40px;}
    </style>
</head>
<body>
    <div>
        <h2>이벤트페이지</h2>
            <img src="images/event1.jpg" usemap="#ent">

        <map name="ent">
            <area shape="rect" coords="45,480,160,340" 
            href="https://www.apple.com/kr/shop/buy-ipad" target="_blank">
        
            <area shape="rect" coords="175,480,290,340"
            href="https://www.apple.com/kr/shop/buy-watch" target="_blank">

            <area shape="rect" coords="320,480,420,340" 
            href="https://www.apple.com/kr/airpods" target="_blank">

            <area shape="rect" coords="450,480,560,340" 
            href="https://www.samsung.com/sec" target="_blank">
            <!--삼각형 : rect-->
            <area shape="rect" coords="450,480,560,340" 
            href="https://www.nespresso.com/kr" target="_blank">
            <!--원 : circle-->
            <area shape="circle" coords="120,100,50" 
            href="https://www.samsung.com/sec" target="_blank">
            <!--다각형 : poly-->
            <area shape="poly" coords="385,60,470,60,520,150,320,150" 
            href="https://www.naver.com/" target="_blank">

        </map>
    </div>
</body>
</html>
