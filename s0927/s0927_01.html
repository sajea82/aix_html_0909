<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>미니 덧세 계산기 만들기</title>
</head>
<body>
    <h2>미니 덧셈 계산기</h2>
    <input type="text" id="num1" placeholder="첫 번째 숫자">
    <input type="text" id="num2" placeholder="두 번째 숫자">
    <br><br>
    <button onclick="add()">+</button>
    <button onclick="sub()">-</button>
    <button onclick="mul()">*</button>
    <button onclick="div()">/</button>

    <p id="result"></p>
    <script>
        function checkInput(){
            var v1 = document.getElementById("num1").value;
            var v2 = document.getElementById("num2").value;

            if (v1 === ""||v2 === ""){
                document.getElementById("result").innerText = "두 숫자를 입력해주세요!"
                return null;
            }
            return {
                n1 : Number(v1),
                n2 : Number(v2)
            };
        }
        function add(){
            var date = checkInput();
            if (date !== null){
                document.getElementById("result").innerText = "결과 : "+(date.n1+date.n2);
            }
        }
        function sub(){
            var date = checkInput();
            if (date !== null){
                document.getElementById("result").innerText = "결과 : "+(date.n1-date.n2);
            }
        }
        function mul(){
            var date = checkInput();
            if (date !== null){
                document.getElementById("result").innerText = "결과 : "+(date.n1*date.n2);
            }
        }
        function div(){
            var date = checkInput();
            if (date !== null){
                if (date.n2 === 0){
                    document.getElementById("result").innerText = "0으로 나눌 수 없습니다!";
                }else{
                    document.getElementById("result").innerText = "결과 : "+(date.n1/date.n2);
                }
            }
        }
    </script>
</body>
</html>
